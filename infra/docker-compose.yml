# docker-compose — весь стенд поднимается одной командой:
#   docker compose -f infra/docker-compose.yml up --build
# См. docs/04_ARCHITECTURE.md. Значения секретов — из .env (не коммитим).

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mlsec}
      POSTGRES_USER: ${POSTGRES_USER:-mlsec_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
    ports: ["5432:5432"]

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-change_me}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-change_me}
    ports: ["9000:9000", "9001:9001"]
    volumes:
      - miniodata:/data

  redis:
    image: redis:7
    ports: ["6379:6379"]

  mlflow:
    build: { context: .., dockerfile: infra/Dockerfile.mlflow }
    # MLflow слушает ВНУТРИ сети; наружу публикуется только через authproxy.
    expose: ["5000"]
    environment:
      MLFLOW_S3_ENDPOINT_URL: ${MINIO_ENDPOINT:-http://minio:9000}
      AWS_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY:-change_me}
      AWS_SECRET_ACCESS_KEY: ${MINIO_SECRET_KEY:-change_me}
    depends_on: [postgres, minio]

  authproxy:
    # Auth-прокси (oauth2-proxy / Authelia / кастом): SSO + серверный штамп identity.
    # Публикует MLflow и проставляет X-Authenticated-User. TODO: конфиг в infra/authproxy/.
    image: quay.io/oauth2-proxy/oauth2-proxy:latest
    volumes:
      - ./authproxy:/etc/authproxy:ro
    ports: ["4180:4180"]
    depends_on: [mlflow]

  backend:
    build: { context: .., dockerfile: infra/Dockerfile.backend }
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000
    environment:
      - APP_DEBUG=${APP_DEBUG:-true}
    env_file: [../.env]
    ports: ["8000:8000"]
    depends_on: [postgres, minio, redis, mlflow]

  ui:
    build: { context: .., dockerfile: infra/Dockerfile.ui }
    command: streamlit run ui/app.py --server.port 8501 --server.address 0.0.0.0
    environment:
      - GATEKEEPER_URL=http://backend:8000
      - APP_DEBUG=${APP_DEBUG:-true}
    ports: ["8501:8501"]
    depends_on: [backend]

  # Инференс-сервисы (G7) — по микросервису на модель (масштабируемость/изоляция).
  inference-credit:        # модель №1: табличный credit scoring
    build: { context: .., dockerfile: infra/Dockerfile.backend }
    command: uvicorn src.serve.app:app --host 0.0.0.0 --port 8080
    environment:
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - MODEL_PATH=/app/artifacts/credit_scoring.onnx
    ports: ["8080:8080"]
    volumes:
      - ../logs:/app/logs                      # фичи для G6 PSI (общий том с monitor)
      - ../artifacts:/app/artifacts:ro
    depends_on: [redis]

  inference-text:          # модель №2: текстовый классификатор
    build: { context: .., dockerfile: infra/Dockerfile.backend }
    command: uvicorn src.serve.app_text:app --host 0.0.0.0 --port 8081
    environment:
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - TEXT_MODEL_PATH=/app/artifacts/text_classifier.onnx
    ports: ["8081:8081"]
    volumes:
      - ../logs:/app/logs
      - ../artifacts:/app/artifacts:ro
    depends_on: [redis]

  inference-risk:          # модель №3: transaction risk (GBT, 6 фич)
    build: { context: .., dockerfile: infra/Dockerfile.backend }
    command: uvicorn src.serve.app_risk:app --host 0.0.0.0 --port 8082
    environment:
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - RISK_MODEL_PATH=/app/artifacts/transaction_risk.onnx
    ports: ["8082:8082"]
    volumes:
      - ../logs:/app/logs
      - ../artifacts:/app/artifacts:ro
    depends_on: [redis]

  # G6 мониторинг — работает постоянно (watch-режим): дрейф по логам инференса + детект подмены.
  monitor:
    build: { context: .., dockerfile: infra/Dockerfile.backend }
    command: >
      python src/monitor/monitor.py
      --reference data/train_m1_clean.csv
      --live-model credit_scoring --columns amount age
      --watch 30
    volumes:
      - ../logs:/app/logs          # общий том с инференс-сервисами (фичи для PSI)
      - ../data:/app/data:ro
      - ../artifacts:/app/artifacts:ro
    depends_on: [inference-credit]

  # CI: self-hosted GitHub Actions runner (джобы исполняются локально). TODO: образ/токен.
  ci-runner:
    image: myoung34/github-runner:latest
    environment:
      - REPO_URL=https://github.com/${GITHUB_REPO:-org/mlsecopus}
      - RUNNER_NAME=mlsec-local
      - ACCESS_TOKEN=${GITHUB_TOKEN:-change_me}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock   # для запуска гейт-образов

volumes:
  pgdata:
  miniodata:
