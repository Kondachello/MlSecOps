# config/gates.yml — описание гейтов для UI (метаданные).
#
# Реальные реализации живут в gates/*.py (см. gates/__init__.py). Этот YAML — НЕ источник
# истины для логики (его раньше использовал плейсхолдер), теперь это просто справочник,
# отображаемый в UI «карта гейтов».
#
# Источник истины: gates.base.GATE_REGISTRY (заполняется декораторами @register_gate).
# Бэкенд берёт оттуда (см. core.gates_pipeline.load_pipeline).
#
# Этот файл оставлен для:
#   • документации (одно место где видно весь набор + угрозы);
#   • возможности при желании отключить гейт из UI (поле enabled — пока не используется).

version: 2

pipeline:
  - id: DATA
    name: Data
    description: "PII (карты/email/СНИЛС), poison-колонки, доля null, схема"
    enabled: true
    severity: high
    order: 10
    threats: ["#1", "#2", "#11", "#15"]
    impl: gates.g_data

  - id: G0
    name: Secrets
    description: "Секреты в артефактах (gitleaks → regex fallback)"
    enabled: true
    severity: critical
    order: 20
    threats: ["#8", "#10"]
    impl: gates.g0_secrets

  - id: G5
    name: Model scan
    description: "Сканер весов: pickle opcode scan + whitelist безопасных форматов"
    enabled: true
    severity: critical
    order: 30
    threats: ["#3", "#4", "#26"]
    impl: gates.g5_modelscan

  - id: G7
    name: Artifact sign
    description: "SHA256 manifest + .sig артефакта (verify на promote)"
    enabled: true
    severity: medium
    order: 40
    threats: ["#3", "#4", "#26"]
    impl: gates.g7_sign

  - id: G8
    name: ML quality
    description: "ONNX holdout accuracy / degenerate-predictor check"
    enabled: true
    severity: high
    order: 50
    threats: ["#17", "#20"]
    impl: gates.g8_quality
