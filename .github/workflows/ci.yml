# GitHub Actions — стартовый пайплайн (проверка, что каркас работает).
# Запускается автоматически на push и pull_request, плюс вручную (workflow_dispatch).
# Дальше сюда добавятся Security Gates (G1..G7) отдельными job'ами.

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:        # ручной запуск кнопкой "Run workflow"

jobs:
  # --- Статическая проверка: компилируется ли код ---
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m py_compile core/db.py core/storage.py core/model_card.py ui/app.py tests/smoke_db.py src/gates/data_gate.py src/ingest_dataset.py
      - run: echo "syntax OK"

  # --- G1 Data Gate: чистый датасет проходит, отравленный блокируется ---
  data-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --no-cache-dir pandas
      # чистый датасет ДОЛЖЕН пройти (exit 0)
      - name: clean dataset passes
        run: python src/gates/data_gate.py data/datasets/train_clean.csv --expected-cols amount,age,target
      # отравленный ДОЛЖЕН заблокироваться (exit != 0) — иначе job падает
      - name: poisoned dataset is blocked
        run: |
          if python src/gates/data_gate.py data/datasets/train_poisoned.csv --expected-cols amount,age,target; then
            echo "❌ G1 не заблокировал отравленный датасет"; exit 1
          else
            echo "✅ G1 корректно заблокировал отравленный датасет"
          fi

  # --- Smoke-тест контура БД: Postgres как service + init.sql + log_event ---
  db-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mlsecops
          POSTGRES_PASSWORD: mlsecops
          POSTGRES_DB: mlsecops
        ports:
          - 5432:5432
        # ждём, пока postgres будет готов принимать соединения
        options: >-
          --health-cmd "pg_isready -U mlsecops"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # core/db.py читает эти переменные; service проброшен на localhost раннера
      PG_HOST: localhost
      PG_PORT: "5432"
      PG_USER: mlsecops
      PG_PASSWORD: mlsecops
      PG_DATABASE: mlsecops
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --no-cache-dir psycopg2-binary==2.9.9
      - run: python tests/smoke_db.py
