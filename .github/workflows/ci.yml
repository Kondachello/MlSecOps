# CI — проверки на PR/верификации. Исполняется self-hosted runner-ом (см. docs/12_CICD.md).
# Принцип каждой гейт-джобы: «чистое проходит / плохое блокируется» (две проверки).
name: ci

on:
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
  repository_dispatch:
    types: [verify, scan]

jobs:
  syntax:
    runs-on: [self-hosted]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: py_compile
        run: |
          python -m py_compile \
            core/db.py core/identity.py core/model_card.py \
            core/storage.py core/mlflow_utils.py \
            src/api/main.py \
            src/gates/data_gate/data_gate.py \
            src/gates/code_gate/code_gate.py \
            src/gates/dependency_gate/dependency_gate.py \
            src/gates/model_gate/model_gate.py \
            src/gates/registry_gate/registry_gate.py \
            src/ingest_dataset/ingest_dataset.py \
            src/run_data_checks/run_data_checks.py \
            src/serve/app.py src/serve/attack_sim.py \
            src/train/train.py src/monitor/monitor.py \
            ui/app.py infra/seed_admin.py data/make_datasets.py

  data-gate:
    runs-on: [self-hosted]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install --no-cache-dir pandas pyarrow
      - run: python data/make_datasets.py
      - name: clean passes
        run: python src/gates/data_gate/data_gate.py --path data/train_m1_clean.csv --json
      - name: poisoned is blocked
        run: |
          if python src/gates/data_gate/data_gate.py --path data/train_m1_poisoned.csv --json; then
            echo "G1 не сработал на приманке (PII+balance)"; exit 1
          else echo "ok — отравленный датасет заблокирован"; fi

  code-gate:
    runs-on: [self-hosted]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: install python scanners
        run: pip install --no-cache-dir bandit pip-audit
      # gitleaks устанавливается в Dockerfile; в CI-runner среде — graceful SKIP если нет
      - name: clean src — должен PASS (bandit/pip-audit; gitleaks SKIP если нет бинарника)
        run: |
          result=$(python src/gates/code_gate/code_gate.py --path src --stage ci --json)
          echo "$result"
          echo "$result" | python -c "
          import json,sys
          r=json.load(sys.stdin)
          # Разрешаем SKIP (нет бинарника), но не FAIL
          for c in r['checks']:
              if c['status']=='FAIL':
                  print(f'FAIL в чистом коде: {c}'); sys.exit(1)
          "
      - name: insecure fixture — должен FAIL (pip-audit обнаружит CVE)
        run: |
          if python src/gates/code_gate/code_gate.py --path demo/insecure --stage ci --json; then
            echo "G2 не обнаружил уязвимости в demo/insecure"; exit 1
          else echo "ok — небезопасный код заблокирован"; fi
        # Ожидаем FAIL по cve_deps (flask==1.0.2, numpy==1.21.0 имеют CVE)

  dependency-gate:
    runs-on: [self-hosted]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: clean requirements pass
        run: python src/gates/dependency_gate/dependency_gate.py --path demo/requirements_clean.txt --json
      - name: typosquat is blocked
        run: |
          if python src/gates/dependency_gate/dependency_gate.py --path demo/insecure/requirements_vuln.txt --json; then
            echo "G3 не сработал на pytirch/tenserflew"; exit 1
          else echo "ok — typosquat заблокирован"; fi

  model-gate:
    runs-on: [self-hosted]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: install python scanners
        run: pip install --no-cache-dir modelscan picklescan
      - name: generate demo model fixtures
        run: python demo/insecure/make_model_fixtures.py
      - name: safe safetensors passes
        run: python src/gates/model_gate/model_gate.py --path demo/model_safe.safetensors --json
      - name: unsafe pkl is blocked
        run: |
          if python src/gates/model_gate/model_gate.py --path demo/insecure/model_unsafe.pkl --json; then
            echo "G4 не заблокировал .pkl"; exit 1
          else echo "ok — .pkl заблокирован (формат запрещён)"; fi

  registry-gate:
    runs-on: [self-hosted]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: complete card passes
        run: python src/gates/registry_gate/registry_gate.py --card demo/model_card_complete.json --json
      - name: incomplete card is blocked
        run: |
          if python src/gates/registry_gate/registry_gate.py --card demo/insecure/model_card_incomplete.json --json; then
            echo "G5 не заблокировал неполный паспорт"; exit 1
          else echo "ok — неполный паспорт заблокирован (owner/tier/lineage)"; fi

  db-smoke:
    runs-on: [self-hosted]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: python tests/smoke_db.py

  build-gates:
    # Сборка изолированных образов гейтов (1 гейт = 1 образ). docs/07 §7.2.
    runs-on: [self-hosted]
    steps:
      - uses: actions/checkout@v4
      - name: build gate images
        run: docker compose -f infra/docker-compose.gates.yml build
      - name: generate fixtures for container smoke tests
        run: python demo/insecure/make_model_fixtures.py || true
      - name: smoke — dependency gate (clean/bad in container)
        run: |
          docker run --rm --network none \
            -v "$PWD/demo/requirements_clean.txt:/in/requirements.txt:ro" \
            mlsec-gate-dependency --path /in --json
          if docker run --rm --network none \
            -v "$PWD/demo/insecure/requirements_vuln.txt:/in/requirements.txt:ro" \
            mlsec-gate-dependency --path /in --json; then
            echo "gate не сработал в контейнере"; exit 1
          else echo "ok — заблокировано из контейнера"; fi
      - name: smoke — model gate (safe/unsafe in container)
        run: |
          python data/make_datasets.py
          docker run --rm --network none \
            -v "$PWD/demo/model_safe.safetensors:/in/model.safetensors:ro" \
            mlsec-gate-model --path /in/model.safetensors --json
          if docker run --rm --network none \
            -v "$PWD/demo/insecure/model_unsafe.pkl:/in/model.pkl:ro" \
            mlsec-gate-model --path /in/model.pkl --json; then
            echo "gate не заблокировал .pkl в контейнере"; exit 1
          else echo "ok — .pkl заблокирован из контейнера"; fi
