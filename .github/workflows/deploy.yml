# deploy.yml — деплой в прод. docs/12_CICD.md §deploy, docs/05_CANONICAL_FLOW.md §5.5.
# HITL для Tier=HIGH: workflow стоит до Approve (MLSecOps). trivy — РОВНО один раз (здесь).
name: deploy

on:
  workflow_dispatch:
    inputs:
      model_name: { description: "имя модели",  required: true }
      version:    { description: "версия",      required: true }
  repository_dispatch:
    types: [deploy]

jobs:
  deploy:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install --no-cache-dir -r requirements.txt

      - name: "HITL gate (Tier=HIGH требует approved_by)"
        run: echo 'TODO check approved status in registry; stop if pending_hitl'

      - name: install G2 scanners + trivy
        run: |
          pip install --no-cache-dir bandit pip-audit
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks
          bash scripts/ci/install_trivy.sh
          trivy --version

      - name: build inference image (для trivy image scan)
        run: docker build -f infra/Dockerfile.backend -t mlsec-inference:ci .

      - name: "G2 deploy — secrets + SAST + SCA + trivy image (единственный trivy)"
        run: |
          python src/gates/code_gate/code_gate.py \
            --path . --stage deploy --image mlsec-inference:ci --json > gate-g2-deploy.json
          cat gate-g2-deploy.json
          python scripts/ci/assert_gate_checks.py --require secrets sast cve_deps trivy_image --no-fail gate-g2-deploy.json
      - uses: actions/upload-artifact@v4
        with:
          name: gate-g2-deploy
          path: gate-g2-deploy.json

      - name: "G4 Model Gate (SHA-сверка с реестром)"
        run: python src/gates/model_gate/model_gate.py --path artifacts/model.safetensors --expected-sha "$EXPECTED_SHA" --json
        env: { EXPECTED_SHA: "" }   # TODO: подставить из реестра

      - name: "cosign sign (артефакт + образ)"
        run: echo 'TODO cosign sign using GitHub Actions secrets'

      - name: "Положить в models/prod/* (WORM) + проверка подписи/SHA перед docker run"
        run: echo 'TODO upload lock_prod verify cosign SHA docker run health-check alias production'
