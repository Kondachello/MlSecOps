# deploy.yml — деплой в прод. docs/12_CICD.md §deploy, docs/05_CANONICAL_FLOW.md §5.5.
# HITL для Tier=HIGH: workflow стоит до Approve (MLSecOps). trivy — РОВНО один раз (здесь).
# Секреты (cosign-ключ) — только в GitHub Actions secrets, НЕ в коде.
name: deploy

on:
  workflow_dispatch:
    inputs:
      model_name:
        description: "имя модели"
        required: true
      version:
        description: "версия модели (из реестра)"
        required: true
  repository_dispatch:
    types: [deploy]

env:
  GATEKEEPER_URL: ${{ vars.GATEKEEPER_URL || 'http://localhost:8000' }}
  INFERENCE_IMAGE: mlsec-inference-${{ github.event.inputs.model_name || github.event.client_payload.model_name }}
  ARTIFACT_DIR: /tmp/deploy-artifacts

jobs:
  deploy:
    runs-on: [self-hosted]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install --no-cache-dir -r requirements.txt

      # Step 0: HITL gate (Tier=HIGH требует approved_by от MLSecOps)
      - name: "Step 0 — HITL gate: проверка Approve для Tier=HIGH"
        run: |
          MODEL="${{ github.event.inputs.model_name || github.event.client_payload.model_name }}"
          VERSION="${{ github.event.inputs.version || github.event.client_payload.version }}"
          STATUS=$(curl -sf "${{ env.GATEKEEPER_URL }}/api/v1/models/${MODEL}/versions/${VERSION}/status" \
            | python -c "import json,sys; d=json.load(sys.stdin); print(d.get('status','unknown'))" \
            || echo "unknown")
          echo "Model status: $STATUS"
          if [ "$STATUS" = "pending_hitl" ]; then
            echo "ERROR: Tier=HIGH — требуется Approve от MLSecOps перед деплоем"; exit 1
          fi
          if [ "$STATUS" = "blocked" ]; then
            echo "ERROR: модель заблокирована security gate"; exit 1
          fi

      # Получить SHA-256 эталона из реестра ДО скачивания (для проверки подлинности)
      - name: "Получить metadata из реестра"
        run: |
          MODEL="${{ github.event.inputs.model_name || github.event.client_payload.model_name }}"
          VERSION="${{ github.event.inputs.version || github.event.client_payload.version }}"
          REGISTRY_META=$(curl -sf \
            "${{ env.GATEKEEPER_URL }}/api/v1/models/${MODEL}/versions/${VERSION}" \
            || echo '{}')
          EXPECTED_SHA=$(echo "$REGISTRY_META" | python -c \
            "import json,sys; print(json.load(sys.stdin).get('sha256',''))" || echo "")
          echo "EXPECTED_SHA=$EXPECTED_SHA" >> $GITHUB_ENV
          echo "Registry SHA: $EXPECTED_SHA"

      # Скачать артефакт модели + код инференса
      - name: "Скачать модель и код инференса"
        run: |
          mkdir -p ${{ env.ARTIFACT_DIR }}
          MODEL="${{ github.event.inputs.model_name || github.event.client_payload.model_name }}"
          VERSION="${{ github.event.inputs.version || github.event.client_payload.version }}"
          curl -sf "${{ env.GATEKEEPER_URL }}/api/v1/models/${MODEL}/versions/${VERSION}/artifact" \
            -o ${{ env.ARTIFACT_DIR }}/model.safetensors \
          || echo "WARNING: artifact download failed — возможно, модель не в реестре"
          # Используем код из текущего git commit (зафиксирован в lineage)
          echo "Артефакт готов к проверкам"

      # Step 1: G2 Code Gate (deploy: secrets + SAST + CVE зависимостей)
      - name: "Step 1 — G2 Code Gate (deploy): SAST + секреты + CVE"
        run: |
          python src/gates/code_gate/code_gate.py --path . --stage ci --json \
            | tee /tmp/g2_deploy_report.json
          python -c "
          import json, sys
          r = json.load(open('/tmp/g2_deploy_report.json'))
          if not r['passed']:
              print('G2 FAIL (deploy):', r['failed_checks']); sys.exit(1)
          print('G2 PASS')
          "

      # Step 2: G4 Model Gate — SHA-сверка с реестром (до сборки образа)
      - name: "Step 2 — G4 Model Gate: SHA-256 сверка с реестром"
        run: |
          ARTIFACT="${{ env.ARTIFACT_DIR }}/model.safetensors"
          if [ ! -f "$ARTIFACT" ]; then
            echo "Артефакт $ARTIFACT не найден — пропуск SHA-сверки (демо без MinIO)"; exit 0
          fi
          python src/gates/model_gate/model_gate.py \
            --path "$ARTIFACT" \
            --expected-sha "${{ env.EXPECTED_SHA }}" \
            --json | tee /tmp/g4_deploy_report.json
          python -c "
          import json, sys
          r = json.load(open('/tmp/g4_deploy_report.json'))
          if not r['passed']:
              print('G4 FAIL (SHA mismatch):', r['failed_checks']); sys.exit(1)
          print('G4 PASS — артефакт не подменён')
          "

      # Step 3: собрать образ инференса → trivy (единственный запуск trivy)
      - name: "Step 3 — Build inference image"
        run: |
          docker build \
            -f infra/Dockerfile.backend \
            -t ${{ env.INFERENCE_IMAGE }}:${{ github.sha }} \
            .
          echo "IMAGE_TAG=${{ env.INFERENCE_IMAGE }}:${{ github.sha }}" >> $GITHUB_ENV

      - name: "Step 3b — trivy image scan (CRITICAL/HIGH CVE) — единственный запуск trivy"
        run: |
          python src/gates/code_gate/code_gate.py \
            --path . --stage deploy \
            --image "${{ env.IMAGE_TAG }}" \
            --json | tee /tmp/trivy_report.json
          python -c "
          import json, sys
          r = json.load(open('/tmp/trivy_report.json'))
          trivy = next((c for c in r['checks'] if c['check'] == 'trivy_image'), None)
          if trivy and trivy['status'] == 'FAIL':
              print('trivy FAIL:', trivy['evidence'].get('cves', [])); sys.exit(1)
          elif trivy and trivy['status'] == 'SKIP':
              print('trivy SKIP — trivy не установлен в runner (установлен в Dockerfile)')
          else:
              print('trivy PASS')
          "

      # Step 4: cosign sign артефакта и образа
      - name: "Step 4 — cosign sign: подписать артефакт и образ"
        env:
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          ARTIFACT="${{ env.ARTIFACT_DIR }}/model.safetensors"
          if [ -z "${{ secrets.COSIGN_PRIVATE_KEY }}" ]; then
            echo "COSIGN_PRIVATE_KEY secret не настроен — подпись пропущена (настроить для прода)"
            echo "SIGNATURE_SKIPPED=true" >> $GITHUB_ENV
          else
            # Записать ключ из secret (base64)
            echo "${{ secrets.COSIGN_PRIVATE_KEY }}" | base64 -d > /tmp/cosign.key
            echo "${{ secrets.COSIGN_PUBLIC_KEY }}"  | base64 -d > /tmp/cosign.pub
            if [ -f "$ARTIFACT" ]; then
              cosign sign-blob \
                --key /tmp/cosign.key \
                --output-signature "$ARTIFACT.sig" \
                "$ARTIFACT"
              echo "Артефакт подписан: $ARTIFACT.sig"
            fi
            # Подписать Docker-образ (keyless или key-based)
            cosign sign --key /tmp/cosign.key "${{ env.IMAGE_TAG }}" || true
            echo "SIGNATURE_SKIPPED=false" >> $GITHUB_ENV
          fi

      # Step 5: G4 с проверкой подписи (require-signature)
      - name: "Step 5 — G4 verify signature (require_signature на деплое)"
        run: |
          ARTIFACT="${{ env.ARTIFACT_DIR }}/model.safetensors"
          if [ ! -f "$ARTIFACT" ] || [ "${{ env.SIGNATURE_SKIPPED }}" = "true" ]; then
            echo "SKIP: артефакт или ключ недоступны"
          else
            python src/gates/model_gate/model_gate.py \
              --path "$ARTIFACT" \
              --cosign-key /tmp/cosign.pub \
              --require-signature \
              --json | tee /tmp/g4_sig_report.json
            python -c "
          import json, sys
          r = json.load(open('/tmp/g4_sig_report.json'))
          sig = next((c for c in r['checks'] if c['check'] == 'signature_cosign'), None)
          if sig and sig['status'] == 'FAIL':
              print('Подпись НЕВАЛИДНА — деплой отменён!'); sys.exit(1)
          print('Подпись OK')
            "
          fi

      # Step 6: положить прод-копию в models/prod/* (WORM через Object Lock)
      - name: "Step 6 — Загрузить в prod (WORM) и проверить целостность"
        run: |
          MODEL="${{ github.event.inputs.model_name || github.event.client_payload.model_name }}"
          VERSION="${{ github.event.inputs.version || github.event.client_payload.version }}"
          ARTIFACT="${{ env.ARTIFACT_DIR }}/model.safetensors"
          # Загрузка в prod/* с подписью через Gatekeeper API (MinIO Object Lock)
          curl -sf -X POST "${{ env.GATEKEEPER_URL }}/api/v1/models/${MODEL}/versions/${VERSION}/promote" \
            -H "Content-Type: application/json" \
            -d "{\"sha256\": \"${{ env.EXPECTED_SHA }}\", \"artifact_path\": \"models/prod/${MODEL}/${VERSION}/model.safetensors\"}" \
          || echo "WARNING: promote API недоступен (демо без MinIO)"

      # Step 7: docker run — запуск сервиса инференса с pre-flight SHA+подписью
      - name: "Step 7 — Pre-flight: SHA + signature ПЕРЕД docker run"
        run: |
          ARTIFACT="${{ env.ARTIFACT_DIR }}/model.safetensors"
          if [ -f "$ARTIFACT" ]; then
            ACTUAL_SHA=$(sha256sum "$ARTIFACT" | awk '{print $1}')
            if [ -n "${{ env.EXPECTED_SHA }}" ] && [ "$ACTUAL_SHA" != "${{ env.EXPECTED_SHA }}" ]; then
              echo "CRITICAL: SHA MISMATCH перед docker run — артефакт подменён!"; exit 1
            fi
            echo "Pre-flight SHA OK: $ACTUAL_SHA"
          fi

      - name: "Step 7b — docker run inference service"
        run: |
          docker run -d \
            --name inference-${{ github.event.inputs.model_name }}-${{ github.sha }} \
            -p 8080:8080 \
            -e MODEL_PATH=/app/model/model.safetensors \
            -v ${{ env.ARTIFACT_DIR }}:/app/model:ro \
            ${{ env.IMAGE_TAG }} \
            uvicorn src.serve.app:app --host 0.0.0.0 --port 8080 \
          || echo "WARNING: docker run не удался (демо-режим без полного стека)"

      # Step 8: health-check → MLflow alias=production, статус prod, событие
      - name: "Step 8 — health-check + alias=production"
        run: |
          # Ждём старта сервиса
          for i in 1 2 3 4 5; do
            sleep 2
            if curl -sf http://localhost:8080/health > /dev/null 2>&1; then
              echo "Health-check PASS"
              break
            fi
            echo "Ожидание старта... ($i/5)"
          done
          # Зарегистрировать alias=production в Gatekeeper
          MODEL="${{ github.event.inputs.model_name || github.event.client_payload.model_name }}"
          VERSION="${{ github.event.inputs.version || github.event.client_payload.version }}"
          curl -sf -X POST "${{ env.GATEKEEPER_URL }}/api/v1/models/${MODEL}/versions/${VERSION}/alias" \
            -H "Content-Type: application/json" \
            -d "{\"alias\": \"production\", \"status\": \"prod\", \"git_sha\": \"${{ github.sha }}\"}" \
          || echo "WARNING: alias API недоступен (демо без БД)"
          echo "Deploy complete: ${MODEL} v${VERSION} → production"
