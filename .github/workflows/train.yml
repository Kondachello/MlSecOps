# train.yml — обучение модели В CI (канонический прод-артефакт). docs/12_CICD.md §train.
# Порядок строгий: G2(ci) ПЕРВЫМ → обучение → G4 на CI-артефакте → register (alias=candidate).
name: train

on:
  workflow_dispatch:
    inputs:
      model_name:
        description: "имя модели (например: fraud-detector)"
        required: true
      dataset_name:
        description: "датасет (name из реестра)"
        required: true
      dataset_version:
        description: "версия датасета"
        required: true
      git_commit:
        description: "git SHA кода (передаётся из UI/API)"
        required: true
        default: ${{ github.sha }}
  repository_dispatch:
    types: [train]

env:
  MODEL_ARTIFACT_DIR: artifacts
  GATEKEEPER_URL: ${{ vars.GATEKEEPER_URL || 'http://localhost:8000' }}

jobs:
  train:
    runs-on: [self-hosted]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.git_commit || github.sha }}

      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }

      - name: install dependencies
        run: pip install --no-cache-dir -r requirements.txt

      # Step 1: G2 Code Gate (ci) — ПЕРВЫМ, SAST/SCA перед обучением
      - name: "Step 1 — G2 Code Gate (ci): SAST + секреты + CVE"
        run: |
          python src/gates/code_gate/code_gate.py --path . --stage ci --json | tee /tmp/g2_report.json
          python -c "
          import json, sys
          r = json.load(open('/tmp/g2_report.json'))
          if not r['passed']:
              print('G2 FAIL:', r['failed_checks']); sys.exit(1)
          print('G2 PASS')
          "

      # Step 2: обучение на ПРОВЕРЕННЫХ коде и данных.
      # Диспатч по имени модели → нужный train-скрипт (CLI у всех одинаков).
      - name: "Step 2 — обучение в CI"
        run: |
          mkdir -p ${{ env.MODEL_ARTIFACT_DIR }}
          MODEL="${{ github.event.inputs.model_name || github.event.client_payload.model_name }}"
          case "$MODEL" in
            text_classifier)  SCRIPT=src/train/train_text.py ;;
            transaction_risk) SCRIPT=src/train/train_risk.py ;;
            *)                SCRIPT=src/train/train.py ;;   # credit_scoring (по умолчанию)
          esac
          echo "Обучаю $MODEL через $SCRIPT"
          python "$SCRIPT" \
            --model-name "$MODEL" \
            --git-commit "${{ github.event.inputs.git_commit || github.sha }}" \
            --dataset-name "${{ github.event.inputs.dataset_name || github.event.client_payload.dataset_name }}" \
            --dataset-version "${{ github.event.inputs.dataset_version || github.event.client_payload.dataset_version }}" \
            --data-source-type verified_id
        # train-скрипт пишет artifacts/model_path.txt и artifacts/run_id.txt

      # Step 3: G4 Model Gate на CI-артефакте (формат + modelscan + SHA)
      - name: "Step 3 — G4 Model Gate на CI-артефакте"
        run: |
          # Путь к артефакту — из файла, записанного train.py
          if [ -f "${{ env.MODEL_ARTIFACT_DIR }}/model_path.txt" ]; then
            MODEL_PATH=$(cat "${{ env.MODEL_ARTIFACT_DIR }}/model_path.txt")
          else
            # Fallback: первый файл в artifacts/ с разрешённым расширением
            MODEL_PATH=$(find "${{ env.MODEL_ARTIFACT_DIR }}" \
              \( -name "*.safetensors" -o -name "*.onnx" -o -name "*.cbm" \) \
              | head -1)
          fi
          if [ -z "$MODEL_PATH" ]; then
            echo "Артефакт модели не найден в ${{ env.MODEL_ARTIFACT_DIR }}/"; exit 1
          fi
          echo "MODEL_PATH=$MODEL_PATH" >> $GITHUB_ENV
          python src/gates/model_gate/model_gate.py --path "$MODEL_PATH" --json \
            | tee /tmp/g4_report.json
          python -c "
          import json, sys
          r = json.load(open('/tmp/g4_report.json'))
          # Вытащить SHA-256 из evidence для регистрации
          for c in r['checks']:
              if c['check'] == 'integrity_sha256':
                  sha = c['evidence'].get('actual', '')
                  with open('/tmp/model_sha256.txt', 'w') as f: f.write(sha)
                  print('SHA-256:', sha)
          if not r['passed']:
              print('G4 FAIL:', r['failed_checks']); sys.exit(1)
          print('G4 PASS')
          "

      # Step 4: Consistency train↔serve (#19)
      - name: "Step 4 — Consistency check train↔serve"
        run: |
          if [ -f "tests/test_consistency.py" ]; then
            pytest tests/test_consistency.py -v --tb=short \
              --model-path "${MODEL_PATH}" || (echo "consistency FAIL — train/serve расходятся"; exit 1)
          else
            echo "tests/test_consistency.py не найден — SKIP (добавить для демо #19)"
          fi
        continue-on-error: false

      # Step 5: register (Postgres + MLflow, alias=candidate, trained_in_ci=true)
      - name: "Step 5 — register_model (alias=candidate, lineage, trained_in_ci=true)"
        run: |
          MODEL_SHA=$(cat /tmp/model_sha256.txt 2>/dev/null || echo "")
          RUN_ID=$(cat "${{ env.MODEL_ARTIFACT_DIR }}/run_id.txt" 2>/dev/null || echo "")
          curl -sf -X POST "${{ env.GATEKEEPER_URL }}/api/v1/register" \
            -H "Content-Type: application/json" \
            -d "{
              \"name\": \"${{ github.event.inputs.model_name || github.event.client_payload.model_name }}\",
              \"version\": \"ci-$(echo $GITHUB_SHA | head -c 8)\",
              \"git_sha\": \"${{ github.sha }}\",
              \"dataset_name\": \"${{ github.event.inputs.dataset_name || github.event.client_payload.dataset_name }}\",
              \"dataset_version\": \"${{ github.event.inputs.dataset_version || github.event.client_payload.dataset_version }}\",
              \"sha256\": \"${MODEL_SHA}\",
              \"run_id\": \"${RUN_ID}\",
              \"trained_in_ci\": true,
              \"alias\": \"candidate\"
            }" \
          || echo "WARNING: register API недоступен (CI без БД) — lineage зафиксирован в G4-отчёте"
