<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="620" viewBox="0 0 1600 620" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#1e1b4b" flood-opacity="0.18"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 Z" fill="#64748B"/>
    </marker>
    <marker id="arrowRed" markerWidth="12" markerHeight="12" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 Z" fill="#EF4444"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1600" height="620" fill="#F8FAFC"/>

  <!-- Title -->
  <text x="800" y="46" text-anchor="middle" font-size="34" font-weight="700" fill="#0F172A">Сквозной поток безопасности ML-модели</text>
  <text x="800" y="80" text-anchor="middle" font-size="18" fill="#475569">Безопасность встроена в каждый шаг: прошёл гейт — дальше, не прошёл — блок с причиной</text>

  <!-- ===== Phase cards ===== -->
  <!-- Card 1: Данные -->
  <g filter="url(#shadow)">
    <rect x="68" y="110" width="224" height="250" rx="18" fill="#EEF2FF" stroke="#6366F1" stroke-width="2"/>
  </g>
  <circle cx="98" cy="140" r="19" fill="#6366F1"/>
  <text x="98" y="147" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">1</text>
  <text x="180" y="190" text-anchor="middle" font-size="40">📊</text>
  <text x="180" y="222" text-anchor="middle" font-size="21" font-weight="700" fill="#1e1b4b">Данные</text>
  <text x="180" y="243" text-anchor="middle" font-size="12.5" fill="#64748B">загрузка датасета</text>
  <rect x="92" y="256" width="176" height="26" rx="13" fill="#6366F1"/>
  <text x="180" y="274" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">G1 · Data</text>
  <text x="180" y="305" text-anchor="middle" font-size="13" fill="#334155">отрава (баланс)</text>
  <text x="180" y="325" text-anchor="middle" font-size="13" fill="#334155">ПДн · схема · инъекции</text>

  <!-- Card 2: Код -->
  <g filter="url(#shadow)">
    <rect x="316" y="110" width="224" height="250" rx="18" fill="#EEF2FF" stroke="#6366F1" stroke-width="2"/>
  </g>
  <circle cx="346" cy="140" r="19" fill="#6366F1"/>
  <text x="346" y="147" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">2</text>
  <text x="428" y="190" text-anchor="middle" font-size="40">💻</text>
  <text x="428" y="222" text-anchor="middle" font-size="21" font-weight="700" fill="#1e1b4b">Код</text>
  <text x="428" y="243" text-anchor="middle" font-size="12.5" fill="#64748B">PR в CI/CD</text>
  <rect x="340" y="256" width="176" height="26" rx="13" fill="#6366F1"/>
  <text x="428" y="274" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">G2 Code · G3 Supply</text>
  <text x="428" y="305" text-anchor="middle" font-size="13" fill="#334155">секреты · CVE · SAST</text>
  <text x="428" y="325" text-anchor="middle" font-size="13" fill="#334155">типосквоттинг · пиннинг</text>

  <!-- Card 3: Обучение в CI -->
  <g filter="url(#shadow)">
    <rect x="564" y="110" width="224" height="250" rx="18" fill="#EEF2FF" stroke="#6366F1" stroke-width="2"/>
  </g>
  <circle cx="594" cy="140" r="19" fill="#6366F1"/>
  <text x="594" y="147" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">3</text>
  <text x="676" y="190" text-anchor="middle" font-size="40">⚙️</text>
  <text x="676" y="222" text-anchor="middle" font-size="21" font-weight="700" fill="#1e1b4b">Обучение в CI</text>
  <text x="676" y="243" text-anchor="middle" font-size="12.5" fill="#64748B">модель рождается тут</text>
  <rect x="588" y="256" width="176" height="26" rx="13" fill="#6366F1"/>
  <text x="676" y="274" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">G4 Model · G5 Registry</text>
  <text x="676" y="305" text-anchor="middle" font-size="13" fill="#334155">pickle-RCE · формат · SHA</text>
  <text x="676" y="325" text-anchor="middle" font-size="13" fill="#334155">lineage · Tier · паспорт</text>

  <!-- Card 4: HITL -->
  <g filter="url(#shadow)">
    <rect x="812" y="110" width="224" height="250" rx="18" fill="#FFFBEB" stroke="#F59E0B" stroke-width="2"/>
  </g>
  <circle cx="842" cy="140" r="19" fill="#F59E0B"/>
  <text x="842" y="147" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">4</text>
  <text x="924" y="190" text-anchor="middle" font-size="40">🛡️</text>
  <text x="924" y="222" text-anchor="middle" font-size="21" font-weight="700" fill="#78350f">HITL</text>
  <text x="924" y="243" text-anchor="middle" font-size="12.5" fill="#92742c">Tier = HIGH</text>
  <rect x="836" y="256" width="176" height="26" rx="13" fill="#F59E0B"/>
  <text x="924" y="274" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">ручной контроль</text>
  <text x="924" y="305" text-anchor="middle" font-size="13" fill="#5c4310">Approve только MLSecOps</text>
  <text x="924" y="325" text-anchor="middle" font-size="13" fill="#5c4310">иначе 403 (RBAC)</text>

  <!-- Card 5: Деплой -->
  <g filter="url(#shadow)">
    <rect x="1060" y="110" width="224" height="250" rx="18" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="2"/>
  </g>
  <circle cx="1090" cy="140" r="19" fill="#8B5CF6"/>
  <text x="1090" y="147" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">5</text>
  <text x="1172" y="190" text-anchor="middle" font-size="40">🚀</text>
  <text x="1172" y="222" text-anchor="middle" font-size="21" font-weight="700" fill="#3b0764">Деплой</text>
  <text x="1172" y="243" text-anchor="middle" font-size="12.5" fill="#6b3fae">перед продом</text>
  <rect x="1084" y="256" width="176" height="26" rx="13" fill="#8B5CF6"/>
  <text x="1172" y="274" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">trivy · cosign · WORM</text>
  <text x="1172" y="305" text-anchor="middle" font-size="13" fill="#3b0764">сверка подписи и SHA</text>
  <text x="1172" y="325" text-anchor="middle" font-size="13" fill="#3b0764">перед docker run</text>

  <!-- Card 6: Прод -->
  <g filter="url(#shadow)">
    <rect x="1308" y="110" width="224" height="250" rx="18" fill="#F0FFF4" stroke="#22C55E" stroke-width="2"/>
  </g>
  <circle cx="1338" cy="140" r="19" fill="#22C55E"/>
  <text x="1338" y="147" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">6</text>
  <text x="1420" y="190" text-anchor="middle" font-size="40">🌐</text>
  <text x="1420" y="222" text-anchor="middle" font-size="21" font-weight="700" fill="#14532d">Прод-API</text>
  <text x="1420" y="243" text-anchor="middle" font-size="12.5" fill="#3f7d52">рантайм 24/7</text>
  <rect x="1332" y="256" width="176" height="26" rx="13" fill="#22C55E"/>
  <text x="1420" y="274" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">G7 Runtime · G6 Monitor</text>
  <text x="1420" y="305" text-anchor="middle" font-size="13" fill="#14532d">429 · 422 · DLP</text>
  <text x="1420" y="325" text-anchor="middle" font-size="13" fill="#14532d">дрейф · подмена → откат</text>

  <!-- Arrows between cards -->
  <line x1="294" y1="235" x2="314" y2="235" stroke="#64748B" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="542" y1="235" x2="562" y2="235" stroke="#64748B" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="790" y1="235" x2="810" y2="235" stroke="#64748B" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="1038" y1="235" x2="1058" y2="235" stroke="#64748B" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="1286" y1="235" x2="1306" y2="235" stroke="#64748B" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- FAIL rail + ticks -->
  <line x1="180" y1="388" x2="1420" y2="388" stroke="#EF4444" stroke-width="2" stroke-dasharray="7 6"/>
  <line x1="180" y1="360" x2="180" y2="388" stroke="#EF4444" stroke-width="2" stroke-dasharray="5 5"/>
  <line x1="428" y1="360" x2="428" y2="388" stroke="#EF4444" stroke-width="2" stroke-dasharray="5 5"/>
  <line x1="676" y1="360" x2="676" y2="388" stroke="#EF4444" stroke-width="2" stroke-dasharray="5 5"/>
  <line x1="1420" y1="360" x2="1420" y2="388" stroke="#EF4444" stroke-width="2" stroke-dasharray="5 5"/>
  <line x1="800" y1="388" x2="800" y2="404" stroke="#EF4444" stroke-width="2.5" marker-end="url(#arrowRed)"/>

  <!-- Quarantine box -->
  <g filter="url(#shadow)">
    <rect x="600" y="406" width="400" height="52" rx="14" fill="#FEF2F2" stroke="#EF4444" stroke-width="2"/>
  </g>
  <text x="800" y="438" text-anchor="middle" font-size="16.5" font-weight="700" fill="#7f1d1d">✗ FAIL на любом гейте → 🗑️ Карантин + причина (evidence)</text>

  <!-- Audit bar -->
  <g filter="url(#shadow)">
    <rect x="68" y="500" width="1464" height="74" rx="16" fill="#FFF7ED" stroke="#F97316" stroke-width="2"/>
  </g>
  <text x="800" y="533" text-anchor="middle" font-size="17.5" font-weight="700" fill="#7c2d12">🧾 Audit Trail — неподделываемая история (hash-chain), реальная личность из SSO</text>
  <text x="800" y="558" text-anchor="middle" font-size="15" fill="#9a3412">🖥️ Всё видно в UI: реестр · история событий · находки с причиной · дашборд защищённости</text>
</svg>
